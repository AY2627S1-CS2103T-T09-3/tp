name: Prepare release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.5)
        required: true
        type: string

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release request
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo '::error::Use a version tag such as v1.5 or v1.5.1.'
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo '::error::A release already exists for this tag. Review it before preparing another draft.'
            exit 1
          fi

      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk+fx

      - name: Check and build both release JARs
        run: |
          xvfb-run --auto-servernum ./gradlew clean check shadowJar
          ./gradlew shadowJar -PjavafxMacPlatform=mac-aarch64

      - name: Create draft with both downloads
        run: |
          test -s build/libs/scoutly.jar
          test -s build/libs/scoutly-mac-arm64.jar
          printf '%s\n' \
            'Downloads (Java 25 or later):' \
            '- Windows, Linux, Intel Mac: scoutly.jar' \
            '- Apple Silicon Mac (ARM64 Java): scoutly-mac-arm64.jar' \
            > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            build/libs/scoutly.jar build/libs/scoutly-mac-arm64.jar \
            --verify-tag --draft --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets | map(.name) | sort' > "$RUNNER_TEMP/release-assets.json"
          jq --exit-status \
            '. == ["scoutly-mac-arm64.jar", "scoutly.jar"]' \
            "$RUNNER_TEMP/release-assets.json"
